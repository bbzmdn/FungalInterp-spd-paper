<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TMS SPD component explorer</title>
<style>
  :root {
    --bg: #14171c; --panel: #1d222b; --panel2: #252b36; --line: #333b48;
    --fg: #e6e9ef; --muted: #8b94a3; --accent: #5db0ff; --good: #57c98a;
    --model: #c98ae0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  h2 { font-size: 12px; margin: 0 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  header { padding: 10px 14px; border-bottom: 1px solid var(--line);
           display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  select, input[type=number] { background: var(--panel2); color: var(--fg);
           border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; font: inherit; }
  select { max-width: 540px; }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
           border-radius: 4px; padding: 3px 8px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button.sm { padding: 1px 6px; font-size: 11px; }
  label.tog { display: inline-flex; align-items: center; gap: 4px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .main { display: flex; gap: 12px; padding: 10px 14px; align-items: flex-start; }
  .left { flex: 1; min-width: 0; }
  .right { width: 470px; position: sticky; top: 10px; flex-shrink: 0; }

  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .layer { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
           padding: 8px; display: flex; flex-direction: column; min-width: 0; }
  .layer .ctl { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; align-items: center; }
  .comps { overflow-y: auto; max-height: 58vh; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 1px 4px; text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel);
       border-bottom: 1px solid var(--line); cursor: pointer; }
  td.idx { text-align: left; color: var(--muted); }
  tr.active td.ci { color: var(--good); font-weight: 600; }
  input[type=range] { width: 90px; vertical-align: middle; }
  input[type=range]:disabled { opacity: .4; }
  td.maskval { color: var(--fg); width: 38px; }
  td.lockcol { width: 16px; }
  tr.locked-row td.idx { color: var(--warn); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin-top: 10px; }
  .left .card:first-child { margin-top: 0; }
  .stage td { text-align: right; }
  .stage td.lbl { text-align: left; color: var(--muted); }
  .vmodel { color: var(--model); }
  .vrecon { color: var(--accent); }
  .small { color: var(--muted); font-size: 11px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; }
  .swatch { width: 18px; height: 0; border-top-width: 3px; border-top-style: solid; display: inline-block; }
  .ein { width: 46px; }
  .scalebox { width: 64px; }
  .chain { display: flex; flex-direction: row-reverse; gap: 4px; overflow-x: auto;
           align-items: stretch; padding-bottom: 8px; }
  .blk { border: 1px solid var(--line); border-radius: 5px; padding: 5px 6px; background: var(--panel2);
         display: flex; flex-direction: column; gap: 3px; flex: 0 0 auto; }
  .blktitle { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
  .blk table { border-collapse: collapse; }
  .blk td { padding: 0 4px; text-align: right; font-size: 11px; }
  .mat2 { border-collapse: collapse; }
  .mat2 td { border: 1px solid var(--line); padding: 1px 4px; font-size: 10px; text-align: right; }
  .faith { color: var(--warn); white-space: nowrap; font-size: 10px; }
  .op { display: flex; align-items: center; color: var(--muted); font-size: 16px; flex: 0 0 auto; padding: 0 1px; }
  code { background: var(--panel2); padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <h1>TMS SPD explorer</h1>
  <div class="row">
    <label>run</label>
    <select id="run"></select>
  </div>
  <div class="row">
    <label>input</label>
    <span id="inputs"></span>
    <span id="presets"></span>
  </div>
  <div class="row">
    <label>scale</label>
    <input type="range" id="scale" min="0" max="1" step="0.01" value="1" />
    <input type="number" id="scalebox" class="scalebox" step="0.01" value="1.00" />
  </div>
  <div class="row">
    <span class="small">per-layer auto in each panel &middot; or one-shot:</span>
    <button id="allmin">set masks = ci</button>
    <button id="allone">reset masks = 1</button>
  </div>
</header>

<div class="main">
  <div class="left">
    <div class="grid" id="layers"></div>
    <div class="card">
      <h2>forward pass (right &rarr; left) — model vs masked recon</h2>
      <div class="small" id="err" style="margin-bottom:8px"></div>
      <div class="chain" id="chain"></div>
    </div>
  </div>
  <div class="right">
    <div class="card" style="margin-top:0">
      <h2>hidden-space quiver (feature translation)</h2>
      <div class="row" id="quiverToggles" style="margin-bottom:6px"></div>
      <svg id="quiver" width="100%" viewBox="0 0 450 360" style="background:#0f1217;border-radius:4px"></svg>
      <div class="legend small" id="quiverLegend" style="margin-top:6px"></div>
    </div>
    <div class="card">
      <h2>output — model vs recon</h2>
      <svg id="outbars" width="100%" viewBox="0 0 450 200" style="background:#0f1217;border-radius:4px"></svg>
      <div class="legend small" style="margin-top:6px">
        <span><span class="swatch" style="border-top-color:var(--model)"></span>model</span>
        <span><span class="swatch" style="border-top-color:var(--accent)"></span>recon</span>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
// ---------- math helpers ----------
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t)*Math.exp(-x*x);
  return s*y;}
function gelu(x){return 0.5*x*(1+erf(x/Math.SQRT2));}
function lowerLeaky(x){return x>0?Math.min(x,1):0.01*x;}
function relu(v){return v.map(z=>Math.max(0,z));}
function matvec(W,x){return W.map(row=>row.reduce((a,w,j)=>a+w*x[j],0));}
function add(a,b){return a.map((v,i)=>v+b[i]);}
function compActs(A,u){const C=A[0].length,out=new Array(C).fill(0);
  for(let i=0;i<A.length;i++){const ui=u[i],Ai=A[i];for(let c=0;c<C;c++)out[c]+=ui*Ai[c];}
  return out;}
function gateMLP(gate,acts){const C=acts.length,N=gate.mlp_in[0].length,out=new Array(C);
  for(let c=0;c<C;c++){let s=gate.out_bias[c];const mi=gate.mlp_in[c],ib=gate.in_bias[c],mo=gate.mlp_out[c];
    for(let n=0;n<N;n++)s+=gelu(acts[c]*mi[n]+ib[n])*mo[n];out[c]=s;}
  return out;}
function reconWeight(A,B,mask){const din=A.length,C=A[0].length,dout=B[0].length;
  const W=Array.from({length:dout},()=>new Array(din).fill(0));
  for(let c=0;c<C;c++){const m=mask[c];if(m===0)continue;
    for(let i=0;i<din;i++){const aic=A[i][c]*m;const Bc=B[c];for(let o=0;o<dout;o++)W[o][i]+=aic*Bc[o];}}
  return W;}
function matmul(A,B){const m=A.length,k=B.length,n=B[0].length,O=Array.from({length:m},()=>new Array(n).fill(0));
  for(let i=0;i<m;i++)for(let j=0;j<n;j++){let s=0;for(let t=0;t<k;t++)s+=A[i][t]*B[t][j];O[i][j]=s;}return O;}
function fmt(x){return (x>=0?" ":"")+x.toFixed(3);}
function vec(v){return "["+v.map(fmt).join(", ")+"]";}
function clamp01(x){return Math.max(0,Math.min(1,x));}

// ---------- state ----------
const DATA = window.TMS_DATA.runs;
const RUNS = Object.keys(DATA);
let run, state, comp;
const QUIVER = {modelL1:true, reconL1:true, reconHid:false,
  modelL1out:false, reconL1out:false, modelHidOut:true, reconHidOut:true};

function initState(){
  const r=DATA[run], nf=r.n_features;
  state={input:new Array(nf).fill(0), scale:1, masks:{}, sort:{}, auto:{}, locked:{}};
  state.input[0]=1;
  for(const L of r.order){state.masks[L]=new Array(r.C).fill(1); state.sort[L]=false;
    state.auto[L]='off'; state.locked[L]=new Array(r.C).fill(false);}
  document.getElementById('scale').value=1;
  document.getElementById('scalebox').value="1.00";
}
// per-layer auto mode: 'off' | 'ci' | 'bin'
function autoVal(mode,ci){return mode==='bin'?(ci>0?1:0):clamp01(ci);}
function applyAutoLayer(name){const mode=state.auto[name];if(mode==='off')return;
  for(let c=0;c<DATA[run].C;c++) if(!state.locked[name][c])
    state.masks[name][c]=autoVal(mode,comp.perLayer[name].ci[c]);}
function applyAutoAll(){for(const L of DATA[run].order) applyAutoLayer(L);}
function scaledInput(){return state.input.map(v=>v*state.scale);}

function recomputeModel(){
  const r=DATA[run], x=scaledInput(), L=r.layers;
  const l1=matvec(L['linear1'].W_model,x);
  const hasHid=r.order.includes('hidden_layers-0');
  const hid=hasHid?matvec(L['hidden_layers-0'].W_model,l1):l1;
  const l2pre=matvec(L['linear2'].W_model,hid);
  const out=relu(add(l2pre,r.out_bias));
  const inputTo={'linear1':x,'hidden_layers-0':l1,'linear2':hid};
  const perLayer={};
  for(const name of r.order){
    const acts=compActs(L[name].A,inputTo[name]);
    const ci=gateMLP(L[name].gate,acts).map(lowerLeaky);
    perLayer[name]={acts,ci};
  }
  comp={modelChain:{input:x,l1,hid,l2pre,out},perLayer};
  applyAutoAll();
}
function setMasksFromCI(){for(const L of DATA[run].order)
  for(let c=0;c<DATA[run].C;c++) if(!state.locked[L][c])
    state.masks[L][c]=clamp01(comp.perLayer[L].ci[c]);}

function reconChain(){
  const r=DATA[run], x=scaledInput(), L=r.layers;
  const W1=reconWeight(L['linear1'].A,L['linear1'].B,state.masks['linear1']);
  const l1=matvec(W1,x);
  const hasHid=r.order.includes('hidden_layers-0');
  let Wh=null,hid;
  if(hasHid){Wh=reconWeight(L['hidden_layers-0'].A,L['hidden_layers-0'].B,state.masks['hidden_layers-0']);hid=matvec(Wh,l1);}
  else hid=l1;
  const W2=reconWeight(L['linear2'].A,L['linear2'].B,state.masks['linear2']);
  const l2pre=matvec(W2,hid);
  const out=relu(add(l2pre,r.out_bias));
  return {input:x,l1,hid,l2pre,out,W1,Wh,W2};
}

// ---------- rendering ----------
function buildHeader(){
  const sel=document.getElementById('run');
  sel.innerHTML=RUNS.map(n=>`<option value="${n}">${n}</option>`).join('');
  sel.value=run;
  sel.onchange=()=>{run=sel.value;initState();recomputeModel();buildInputs();buildLayers();refresh();};
}
function buildInputs(){
  const wrap=document.getElementById('inputs');
  wrap.innerHTML=state.input.map((v,i)=>
    `<input class="ein" type="number" step="0.1" data-i="${i}" value="${v}">`).join(' ');
  wrap.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{
    state.input[+inp.dataset.i]=parseFloat(inp.value)||0; onInputChanged();});
  const pre=document.getElementById('presets');
  pre.innerHTML=state.input.map((_,i)=>`<button class="sm" data-e="${i}">e${i}</button>`).join('')
    +`<button class="sm" data-e="-1">0</button>`;
  pre.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const e=+b.dataset.e; state.input=state.input.map((_,i)=>e===i?1:0);
    buildInputs(); onInputChanged();});
}

// input or scale changed: recompute model, refresh act-independent cells + masks if auto
function onInputChanged(){
  recomputeModel();
  updateCiCols();
  updateMaskDOM();   // auto-enabled layers may have new masks
  refresh();
}

function buildLayers(){
  const r=DATA[run], host=document.getElementById('layers');
  host.innerHTML='';
  for(const name of r.order){
    const div=document.createElement('div'); div.className='layer';
    div.innerHTML=`<div class="ctl">
        <strong>${name}</strong>
        <span class="small">${r.layers[name].d_in}&rarr;${r.layers[name].d_out}</span>
        <label class="small">auto
          <select class="autol">
            <option value="off">manual</option>
            <option value="ci">=ci</option>
            <option value="bin">=1[ci&gt;0]</option>
          </select></label>
        <button class="sm" data-act="min">=ci</button>
        <button class="sm" data-act="one">=1</button>
        <button class="sm" data-act="zero">=0</button>
      </div>
      <div class="comps"><table>
        <thead><tr><th title="lock">🔒</th><th data-sort="idx" class="idx">c</th>
          <th data-sort="ci">ci</th><th colspan="2">mask</th></tr></thead>
        <tbody></tbody></table></div>`;
    host.appendChild(div);
    div.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{
      state.sort[name]=(th.dataset.sort==='ci'); buildRows(name,div);});
    const autoSel=div.querySelector('.autol'); autoSel.value=state.auto[name];
    autoSel.onchange=e=>{
      state.auto[name]=e.target.value; applyAutoLayer(name); buildRows(name,div); refresh();};
    div.querySelectorAll('button[data-act]').forEach(b=>b.onclick=()=>{
      for(let c=0;c<r.C;c++){
        if(state.locked[name][c]) continue;
        if(b.dataset.act==='min') state.masks[name][c]=clamp01(comp.perLayer[name].ci[c]);
        if(b.dataset.act==='one') state.masks[name][c]=1;
        if(b.dataset.act==='zero') state.masks[name][c]=0;}
      updateMaskDOM(); refresh();});
    buildRows(name,div);
  }
}

function buildRows(name,div){
  const r=DATA[run], tb=div.querySelector('tbody'), ci=comp.perLayer[name].ci;
  let order=[...Array(r.C).keys()];
  if(state.sort[name]) order.sort((a,b)=>ci[b]-ci[a]);
  tb.innerHTML='';
  for(const c of order){
    const tr=document.createElement('tr'); tr.dataset.c=c;
    if(ci[c]>0.1) tr.classList.add('active');
    const locked=state.locked[name][c];
    const sliderDisabled=state.auto[name]!=='off' && !locked;  // auto drives it, unless locked
    tr.innerHTML=`<td class="lockcol"><input type="checkbox" title="lock mask" ${locked?'checked':''}></td>
      <td class="idx">${c}</td><td class="ci">${fmt(ci[c])}</td>
      <td><input type="range" min="0" max="1" step="0.01" value="${state.masks[name][c]}" ${sliderDisabled?'disabled':''}></td>
      <td class="maskval">${state.masks[name][c].toFixed(2)}</td>`;
    if(locked) tr.classList.add('locked-row');
    const rng=tr.querySelector('input[type=range]'), val=tr.querySelector('.maskval');
    rng.oninput=()=>{const v=parseFloat(rng.value);state.masks[name][c]=v;val.textContent=v.toFixed(2);refresh();};
    tr.querySelector('input[type=checkbox]').onchange=e=>{
      state.locked[name][c]=e.target.checked; buildRows(name,div);};
    tb.appendChild(tr);
  }
}

// update ci cells (input/scale changed) without rebuilding sliders
function updateCiCols(){
  const r=DATA[run];
  document.querySelectorAll('#layers .layer').forEach((div,li)=>{
    const name=r.order[li], ci=comp.perLayer[name].ci;
    if(state.sort[name]){buildRows(name,div);return;}
    div.querySelectorAll('tbody tr').forEach(tr=>{
      const c=+tr.dataset.c;
      tr.querySelector('.ci').textContent=fmt(ci[c]);
      tr.classList.toggle('active',ci[c]>0.1);});
  });
}
// push state.masks into existing slider DOM
function updateMaskDOM(){
  const r=DATA[run];
  document.querySelectorAll('#layers .layer').forEach((div,li)=>{
    const name=r.order[li];
    div.querySelectorAll('tbody tr').forEach(tr=>{
      const c=+tr.dataset.c, m=state.masks[name][c];
      tr.querySelector('input[type=range]').value=m;
      tr.querySelector('.maskval').textContent=m.toFixed(2);});
  });
}

// faithfulness of a masked recon weight vs the target weight: sum of squared diffs + count
function faith(Wm,Wr){let sse=0,n=0;
  for(let i=0;i<Wm.length;i++)for(let j=0;j<Wm[0].length;j++){sse+=(Wm[i][j]-Wr[i][j])**2;n++;}
  return {sse,n,mean:sse/n};}
function matHTML2(M,cls){return '<table class="mat2">'+M.map(row=>'<tr>'+
  row.map(v=>`<td class="${cls}">${v.toFixed(2)}</td>`).join('')+'</tr>').join('')+'</table>';}
function vecBlock(title,mv,rv){
  const col=(a,cls,lbl)=>`<div class="${cls} small">${lbl}</div>`+
    '<table>'+a.map(v=>`<tr><td class="${cls}">${fmt(v)}</td></tr>`).join('')+'</table>';
  return `<div class="blk"><div class="blktitle">${title}</div>
    ${col(mv,'vmodel','m')}
    <div style="margin-top:3px">${col(rv,'vrecon','r')}</div></div>`;}
function matOp(title,Wm,Wr){
  const fa=faith(Wm,Wr);
  return {html:`<div class="blk"><div class="blktitle">${title} ${Wm.length}&times;${Wm[0].length}</div>
    <div class="faith">mse ${fa.mean.toExponential(1)} &middot; sse ${fa.sse.toExponential(1)}</div>
    <div><div class="vmodel small">model W</div>${matHTML2(Wm,'vmodel')}</div>
    <div style="margin-top:3px"><div class="vrecon small">recon Ŵ</div>${matHTML2(Wr,'vrecon')}</div>
    </div>`, fa};}

function refresh(){
  const m=comp.modelChain, rc=reconChain(), L=DATA[run].layers;
  const hasHid=!!rc.Wh;
  const op=label=>`<div class="op">${label}</div>`;
  const parts=[];                                   // computation order; row-reverse shows it right→left
  parts.push(vecBlock('input',m.input,rc.input));
  const o1=matOp('layer1 W₁',L['linear1'].W_model,rc.W1); parts.push(op('·'),o1.html);
  parts.push(op('='),vecBlock('out layer1',m.l1,rc.l1));
  const faiths=[['layer1',o1.fa]];
  if(hasHid){
    const oh=matOp('hidden Wₕ',L['hidden_layers-0'].W_model,rc.Wh); parts.push(op('·'),oh.html);
    parts.push(op('='),vecBlock('out hidden',m.hid,rc.hid));
    faiths.push(['hidden',oh.fa]);
  }
  const o2=matOp('layer2 W₂',L['linear2'].W_model,rc.W2); parts.push(op('·'),o2.html);
  parts.push(op('='),vecBlock('out layer2',m.l2pre,rc.l2pre));
  faiths.push(['layer2',o2.fa]);
  const biasBlk=`<div class="blk"><div class="blktitle">+bias, relu</div>
    <table><tr><td class="small">bias</td></tr>${DATA[run].out_bias.map(b=>`<tr><td>${fmt(b)}</td></tr>`).join('')}</table></div>`;
  parts.push(op('+'),biasBlk,op('='),vecBlock('relu(out+bias)',m.out,rc.out));
  document.getElementById('chain').innerHTML=parts.join('');  // container is row-reverse → shows right→left

  const e=m.out.reduce((s,v,i)=>s+(v-rc.out[i])**2,0);
  const totSse=faiths.reduce((s,[,f])=>s+f.sse,0), totN=faiths.reduce((s,[,f])=>s+f.n,0);
  document.getElementById('err').innerHTML=
    `output MSE = <code>${e.toExponential(2)}</code> &nbsp;|&nbsp; `+
    `faithfulness (masked Ŵ vs W): `+
    faiths.map(([n,f])=>`${n} <code>${f.mean.toExponential(1)}</code>`).join(' &middot; ')+
    ` &middot; total <code>${(totSse/totN).toExponential(2)}</code>`;
  drawQuiver(rc);
  drawOutputBars(m.out,rc.out);
}

function drawOutputBars(model,recon){
  const svg=document.getElementById('outbars');
  const n=model.length, W=450, H=200, padL=8, padR=8, padB=24, padT=10;
  const plotW=W-padL-padR, plotH=H-padB-padT;
  let mx=0; for(let i=0;i<n;i++) mx=Math.max(mx,model[i],recon[i]); mx=Math.max(mx,1e-6)*1.1;
  const y0=padT+plotH;                 // baseline (outputs are relu >= 0)
  const Y=v=>y0-(v/mx)*plotH;
  const groupW=plotW/n, bw=Math.min(22,groupW/2-3);
  let s=`<line x1="${padL}" y1="${y0}" x2="${W-padR}" y2="${y0}" stroke="#2a3038"/>`;
  for(let i=0;i<n;i++){
    const gx=padL+groupW*i+groupW/2;
    const pairs=[[model[i],'var(--model)',-bw-1],[recon[i],'var(--accent)',1]];
    for(const [v,col,off] of pairs){
      s+=`<rect x="${gx+off}" y="${Y(v)}" width="${bw}" height="${y0-Y(v)}" fill="${col}"/>`;
      s+=`<text x="${gx+off+bw/2}" y="${Y(v)-2}" fill="${col}" font-size="9" text-anchor="middle">${v.toFixed(2)}</text>`;
    }
    s+=`<text x="${gx}" y="${H-8}" fill="var(--muted)" font-size="10" text-anchor="middle">${i}</text>`;
  }
  svg.innerHTML=s;
}

// ---------- quiver ----------
function buildQuiverToggles(){
  const defs=[['modelL1','model L1'],['reconL1','recon L1'],['reconHid','recon hidden'],
    ['modelL1out','out: model L1'],['reconL1out','out: recon L1'],
    ['modelHidOut','out: model hid'],['reconHidOut','out: recon hid']];
  document.getElementById('quiverToggles').innerHTML=defs.map(([k,l])=>
    `<label class="small tog"><input type="checkbox" data-q="${k}" ${QUIVER[k]?'checked':''}> ${l}</label>`).join(' ');
  document.querySelectorAll('#quiverToggles input').forEach(c=>c.onchange=()=>{QUIVER[c.dataset.q]=c.checked;refresh();});
}
const FEATCOLORS=['#5db0ff','#57c98a','#e0a64b','#e0625b','#c98ae0','#4fd0c0','#d089b0','#b0d089'];
function colCols(W){const n=W[0].length;return [...Array(n).keys()].map(i=>[W[0][i],W[1][i]]);}
function drawQuiver(rc){
  const svg=document.getElementById('quiver'); if(DATA[run].n_hidden!==2){svg.innerHTML='';return;}
  const groups=[];
  if(QUIVER.modelL1) groups.push({dash:'',width:2,pts:colCols(DATA[run].layers['linear1'].W_model)});
  if(QUIVER.reconL1) groups.push({dash:'4 3',width:2,pts:colCols(rc.W1)});
  if(QUIVER.reconHid && rc.Wh) groups.push({dash:'1 3',width:2,pts:colCols(matmul(rc.Wh,rc.W1))});
  const cur=[];
  if(QUIVER.modelL1out)  cur.push({label:'model L1', c:'#c98ae0',p:comp.modelChain.l1});
  if(QUIVER.reconL1out)  cur.push({label:'recon L1', c:'#5db0ff',p:rc.l1});
  if(QUIVER.modelHidOut) cur.push({label:'model hid',c:'#e0a64b',p:comp.modelChain.hid});
  if(QUIVER.reconHidOut) cur.push({label:'recon hid',c:'#57c98a',p:rc.hid});
  let mx=1;
  groups.forEach(g=>g.pts.forEach(p=>{mx=Math.max(mx,Math.abs(p[0]),Math.abs(p[1]));}));
  cur.forEach(d=>{mx=Math.max(mx,Math.abs(d.p[0]),Math.abs(d.p[1]));});
  mx*=1.15;
  const W=450,H=360,cx=W/2,cy=H/2,sc=Math.min(W,H)/2/mx;
  const X=x=>cx+x*sc, Y=y=>cy-y*sc;
  let s=`<line x1="0" y1="${cy}" x2="${W}" y2="${cy}" stroke="#2a3038"/>
         <line x1="${cx}" y1="0" x2="${cx}" y2="${H}" stroke="#2a3038"/>`;
  groups.forEach(g=>g.pts.forEach((p,i)=>{const col=FEATCOLORS[i%FEATCOLORS.length];
    s+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(p[0])}" y2="${Y(p[1])}"
        stroke="${col}" stroke-width="${g.width}" stroke-dasharray="${g.dash}" opacity="0.9"/>
        <text x="${X(p[0])+3}" y="${Y(p[1])}" fill="${col}" font-size="10">${i}</text>`;}));
  cur.forEach(d=>{s+=`<circle cx="${X(d.p[0])}" cy="${Y(d.p[1])}" r="4" fill="${d.c}"/>
        <text x="${X(d.p[0])+5}" y="${Y(d.p[1])-4}" fill="${d.c}" font-size="10">${d.label}</text>`;});
  svg.innerHTML=s;
  const leg=[];
  if(QUIVER.modelL1) leg.push(['solid','model L1 (W₁ cols)']);
  if(QUIVER.reconL1) leg.push(['dashed','recon L1 (Ŵ₁ cols)']);
  if(QUIVER.reconHid) leg.push(['dotted','recon hidden (ŴₕŴ₁ cols)']);
  document.getElementById('quiverLegend').innerHTML=
    leg.map(([st,l])=>`<span><span class="swatch" style="border-top-style:${st};border-top-color:#ccc"></span>${l}</span>`).join('')
    +` <span class="small">numbers = feature index</span>`;
}

// ---------- boot ----------
run=RUNS[0];
initState();recomputeModel();
buildHeader();buildInputs();buildQuiverToggles();buildLayers();

function setScale(v){v=isNaN(v)?0:v;state.scale=v;
  document.getElementById('scale').value=Math.min(1,Math.max(0,v));
  document.getElementById('scalebox').value=v.toFixed(2);onInputChanged();}
document.getElementById('scale').oninput=e=>setScale(parseFloat(e.target.value));
document.getElementById('scalebox').oninput=e=>setScale(parseFloat(e.target.value));

document.getElementById('allmin').onclick=()=>{setMasksFromCI();updateMaskDOM();refresh();};
document.getElementById('allone').onclick=()=>{for(const L of DATA[run].order)
  for(let c=0;c<DATA[run].C;c++) if(!state.locked[L][c]) state.masks[L][c]=1;
  updateMaskDOM();refresh();};
refresh();
</script>
